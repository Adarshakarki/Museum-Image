<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Art Gallery</title>

<link rel="icon" type="image/svg+xml"
href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpath d='M12 6v6l4 2'/%3E%3C/svg%3E">

<script src="https://unpkg.com/lucide@latest"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

#background {
  position: fixed;
  inset: -30px;
  background-position: center;
  background-size: cover;
  filter: blur(30px) brightness(0.4);
  opacity: 0;
}

#background.visible {
  opacity: 1;
}

#art-display {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  z-index: 1;
  opacity: 0;
}

#art-display.visible {
  opacity: 1;
}

#info {
  position: fixed;
  bottom: 35px;
  right: 40px;
  z-index: 3;

  max-width: min(420px, 75vw);
  text-align: right;

  padding: 8px 4px 8px 18px;

  background: rgba(230, 225, 210, 0.09);
  backdrop-filter: blur(5px);

  border-right: 2px solid rgba(255,255,255,0.65);

  text-shadow: 0 1px 8px rgba(0,0,0,0.8);

  transition: opacity 0.3s ease;
}

#info.hidden {
  opacity: 0;
  pointer-events: none;
}

#title {
  font-family: Georgia, serif;
  font-size: 19px;
  font-weight: normal;
  color: #fff;
  letter-spacing: 0.2px;
}

#artist {
  margin-top: 7px;
  font-size: 13px;
  color: rgba(255,255,255,0.85);
}

#museum {
  margin-top: 5px;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.65);
}

#loading {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  z-index: 10;

  background: rgba(255,255,255,0.04);
  opacity: 0;

  transition: opacity 0.5s ease;
}

#loading.active {
  opacity: 1;
}

#progress {
  width: 20%;
  height: 100%;
  background: rgba(255,255,255,0.4);
  animation: loading 2s ease-in-out infinite;
}

@keyframes loading {
  0% {
    transform: translateX(-110%);
  }

  100% {
    transform: translateX(600%);
  }
}

#slideshow-status {
  position: fixed;
  top: 22px;
  right: 25px;
  z-index: 4;

  display: flex;
  align-items: center;
  gap: 8px;

  padding: 7px 11px;
  border-radius: 20px;

  background: rgba(0,0,0,0.2);
  color: rgba(255,255,255,0.65);

  font-size: 11px;
  letter-spacing: 0.5px;

  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}

#slideshow-status.visible {
  opacity: 1;
}

#slideshow-status svg {
  width: 13px;
  height: 13px;
  stroke-width: 1.5;
}

:fullscreen #slideshow-status {
  display: none !important;
}

:-webkit-full-screen #slideshow-status {
  display: none !important;
}

@media (max-width: 600px) {
  #info {
    right: 15px;
    bottom: 20px;
    max-width: 85vw;
  }

  #title {
    font-size: 16px;
  }

  #artist {
    font-size: 12px;
  }

  #museum {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<div id="background"></div>

<img id="art-display" alt="Random Artwork">

<div id="loading">
  <div id="progress"></div>
</div>

<div id="info">
  <div id="title"></div>
  <div id="artist"></div>
  <div id="museum"></div>
</div>

<div id="slideshow-status">
  <i data-lucide="clock"></i>
  <span>Slideshow ON · 60 seconds</span>
</div>

<script>
const MET_API =
  "https://collectionapi.metmuseum.org/public/collection/v1";

const CLEVELAND_API =
  "https://openaccess-api.clevelandart.org/api";

const AIC_API =
  "https://api.artic.edu/api/v1";

let metObjectIDs = null;
let clevelandData = null;
let aicData = null;

let slideshowInterval = null;
let currentRequest = 0;

const img = document.getElementById("art-display");
const background = document.getElementById("background");
const title = document.getElementById("title");
const artist = document.getElementById("artist");
const museum = document.getElementById("museum");
const info = document.getElementById("info");
const loading = document.getElementById("loading");
const slideshowStatus = document.getElementById("slideshow-status");

lucide.createIcons();

let infoVisible = true;

try {
  infoVisible = localStorage.getItem("artInfoVisible") !== "false";
} catch (e) {}

function updateInfoVisibility() {
  info.classList.toggle("hidden", !infoVisible);
}

updateInfoVisibility();

// IMAGE PRELOADER
function preloadImage(src) {
  return new Promise((resolve, reject) => {
    const probe = new Image();

    probe.onload = () => resolve(src);
    probe.onerror = reject;

    probe.src = src;
  });
}

async function getMetArtwork() {
  if (!metObjectIDs) {
    const url =
      `${MET_API}/search?hasImages=true&medium=Paintings&departmentId=11&q=oil`;

    const response = await fetch(url);
    if (!response.ok) throw new Error("Met API error");

    const data = await response.json();
    metObjectIDs = data.objectIDs || [];
  }

  if (!metObjectIDs.length) {
    throw new Error("No Met artworks found");
  }

  for (let i = 0; i < 8; i++) {
    const id = metObjectIDs[
      Math.floor(Math.random() * metObjectIDs.length)
    ];

    const response = await fetch(`${MET_API}/objects/${id}`);
    if (!response.ok) continue;

    const obj = await response.json();

    const image = obj.primaryImage || obj.primaryImageSmall;
    const preview = obj.primaryImageSmall || image;

    if (!image) continue;

    try {
      await preloadImage(preview);

      return {
        title: obj.title || "Untitled",
        artist: obj.artistDisplayName || "Unknown artist",
        preview,
        image,
        museum: "The Metropolitan Museum of Art"
      };
    } catch {}
  }

  throw new Error("No loadable Met image found");
}

async function getClevelandArtwork() {
  if (!clevelandData) {
    const url =
      `${CLEVELAND_API}/artworks/?q=painting&has_image=1&limit=1000`;

    const response = await fetch(url);
    if (!response.ok) throw new Error("Cleveland API error");

    const data = await response.json();

    clevelandData = (data.data || []).filter(
      a => a.images?.web?.url
    );
  }

  if (!clevelandData.length) {
    throw new Error("No Cleveland artworks found");
  }

  for (let i = 0; i < 8; i++) {
    const artwork = clevelandData[
      Math.floor(Math.random() * clevelandData.length)
    ];

    const image = artwork.images.web.url;

    try {
      await preloadImage(image);

      const artist = artwork.creators?.length
        ? artwork.creators
            .map(c => c.description || c.name)
            .filter(Boolean)
            .join(", ")
        : "Unknown artist";

      return {
        title: artwork.title || "Untitled",
        artist,
        preview: image,
        image,
        museum: "Cleveland Museum of Art"
      };
    } catch {}
  }

  throw new Error("No loadable Cleveland image found");
}

async function getAICArtwork() {
  if (!aicData) {
    const url =
      `${AIC_API}/artworks/search?q=painting&query[term][is_public_domain]=true&limit=100&fields=id,title,artist_display,date_display,image_id`;

    const response = await fetch(url);
    if (!response.ok) throw new Error("AIC API error");

    const data = await response.json();

    aicData = (data.data || []).filter(a => a.image_id);
  }

  if (!aicData.length) {
    throw new Error("No AIC artworks found");
  }

  for (let i = 0; i < 8; i++) {
    const artwork = aicData[
      Math.floor(Math.random() * aicData.length)
    ];

    const preview =
      `https://www.artic.edu/iiif/2/${artwork.image_id}/full/400,/0/default.jpg`;

    const image =
      `https://www.artic.edu/iiif/2/${artwork.image_id}/full/max/0/default.jpg`;

    try {
      await preloadImage(preview);

      return {
        title: artwork.title || "Untitled",
        artist: artwork.artist_display || "Unknown artist",
        preview,
        image,
        museum: "Art Institute of Chicago"
      };
    } catch {}
  }

  throw new Error("No loadable AIC image found");
}

const museums = [
  getMetArtwork,
  getClevelandArtwork,
  getAICArtwork
];

async function loadRandomPainting() {
  const request = ++currentRequest;

  loading.classList.add("active");

  const shuffled = [...museums].sort(
    () => Math.random() - 0.5
  );

  for (const getArtwork of shuffled) {
    if (request !== currentRequest) return;

    try {
      const artwork = await getArtwork();

      if (request !== currentRequest) return;

      title.textContent = artwork.title;
      artist.textContent = artwork.artist;
      museum.textContent = artwork.museum;

      img.classList.remove("visible");
      img.src = artwork.preview;

      await preloadImage(artwork.preview);

      if (request !== currentRequest) return;

      img.classList.add("visible");

      background.style.backgroundImage =
        `url("${artwork.preview}")`;

      background.classList.add("visible");

      if (artwork.image !== artwork.preview) {
        try {
          await preloadImage(artwork.image);

          if (request !== currentRequest) return;

          img.src = artwork.image;

          background.style.backgroundImage =
            `url("${artwork.image}")`;

        } catch (error) {
          console.warn("High resolution image failed:", error);
        }
      }

      if (request === currentRequest) {
        loading.classList.remove("active");
      }

      return;

    } catch (error) {
      console.error("Museum failed:", error);
    }
  }

  if (request === currentRequest) {
    title.textContent = "Could not load artwork";
    artist.textContent = "";
    museum.textContent = "";

    loading.classList.remove("active");
  }
}

async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.error("Fullscreen error:", error);
  }
}

document.addEventListener("keydown", event => {
  if (
    event.target.tagName === "INPUT" ||
    event.target.tagName === "TEXTAREA" ||
    event.ctrlKey ||
    event.altKey ||
    event.metaKey
  ) return;

  const key = event.key.toLowerCase();

  if (key === "r") {
    loadRandomPainting();
  }

  if (key === "f") {
    infoVisible = !infoVisible;

    updateInfoVisibility();

    try {
      localStorage.setItem(
        "artInfoVisible",
        infoVisible
      );
    } catch (e) {}

    toggleFullscreen();
  }

  if (key === "s") {
    toggleSlideshow();
  }
});

function toggleSlideshow() {
  if (slideshowInterval) {
    clearInterval(slideshowInterval);
    slideshowInterval = null;

    slideshowStatus.querySelector("span").textContent =
      "Slideshow OFF";

    slideshowStatus.classList.add("visible");

    setTimeout(() => {
      if (!slideshowInterval) {
        slideshowStatus.classList.remove("visible");
      }
    }, 2000);

  } else {
    slideshowInterval = setInterval(
      loadRandomPainting,
      60000
    );

    slideshowStatus.querySelector("span").textContent =
      "Slideshow ON · 60 seconds";

    slideshowStatus.classList.add("visible");
  }
}
loadRandomPainting();
</script>
</body>
</html>
